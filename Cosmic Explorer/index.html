<style>
/* Layout: one fixed full-screen 3D stage; a tall invisible scroller drives the camera.
   Welcome text sits left over the Sun-lit system, then fades as the system flies forward. */
:root {
  --bg: #02030a;
  --fg: #eeebe4;
  --muted: #b3b8c2;
  --dim: #8d94a0;
  --accent: #e8a33d;
  --cool: #9fd8e0;
  --line: rgba(255, 255, 255, 0.16);
  --display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --body: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
#scroller { height: 340vh; }
#stage { position: fixed; inset: 0; z-index: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.veil {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(2,3,10,0.82) 0%, rgba(2,3,10,0.55) 38%, rgba(2,3,10,0) 70%);
}
.hero {
  position: fixed; z-index: 2; left: 0; top: 0; bottom: 0;
  width: min(820px, 100%); box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
  padding-left: max(clamp(20px, 7vw, 110px), env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  will-change: opacity, transform;
}
.eyebrow {
  margin: 0; font-family: var(--mono); font-size: 13px; font-weight: 500;
  letter-spacing: 0.32em; color: var(--accent); min-height: 1.2em;
}
.title {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(60px, 11vw, 156px); line-height: 0.92; letter-spacing: -0.015em;
  color: var(--fg); text-wrap: balance; min-height: 1em;
}
.lede {
  margin: 0; max-width: 34ch; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.65;
  color: var(--muted); min-height: 3.3em;
}
.meta {
  margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; color: var(--dim); min-height: 1.2em;
}
.ghost { visibility: hidden; }
.active .t::after {
  content: ''; display: inline-block; width: 2px; height: 0.85em; margin-left: 5px;
  background: var(--accent); vertical-align: -0.05em; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.brand {
  position: fixed; z-index: 3; top: 0; left: 0; display: flex; align-items: center; gap: 12px;
  padding-top: max(28px, env(safe-area-inset-top, 0px));
  padding-left: max(clamp(20px, 4vw, 48px), env(safe-area-inset-left, 0px));
  opacity: 0; pointer-events: none;
}
.brand i { width: 9px; height: 9px; background: var(--accent); display: block; }
.brand span { font-size: 12px; font-weight: 500; letter-spacing: 0.3em; }
.level {
  position: fixed; z-index: 3; top: 0; right: 0; text-align: right;
  padding-top: max(26px, env(safe-area-inset-top, 0px));
  padding-right: max(clamp(20px, 4vw, 48px), env(safe-area-inset-right, 0px));
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; color: var(--dim);
  opacity: 0; pointer-events: none;
}
.level b { display: block; margin-top: 6px; font-weight: 500; color: var(--fg); letter-spacing: 0.18em; }

.cue {
  position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-bottom: max(26px, env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.cue .txt { font-size: 11px; letter-spacing: 0.3em; color: var(--dim); text-align: center; padding: 0 16px; }
.cue .bar { width: 1px; height: 40px; background: linear-gradient(var(--accent), rgba(232,163,61,0)); transform-origin: top; animation: drip 2.2s ease-in-out infinite; }
@keyframes drip { 0% { transform: scaleY(0); } 55% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
#cue-a { transition: opacity 0.4s; }

.skip {
  position: fixed; z-index: 4; right: 0; bottom: 0; min-height: 44px; min-width: 44px; box-sizing: border-box;
  margin-right: max(clamp(20px, 4vw, 48px), env(safe-area-inset-right, 0px));
  margin-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding: 0 18px; display: flex; align-items: center;
  background: rgba(2,3,10,0.55); color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
  font-family: var(--body); font-size: 12px; font-weight: 500; letter-spacing: 0.2em; cursor: pointer;
  transition: border-color 0.2s, opacity 0.4s;
}
.skip:hover { border-color: var(--accent); }
.skip:focus-visible, .skip:active { outline: 2px solid var(--accent); outline-offset: 3px; }

.plabel {
  position: fixed; z-index: 2; left: 0; top: 0; pointer-events: none; white-space: nowrap;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: var(--muted);
  text-shadow: 0 0 6px #02030a, 0 0 12px #02030a; opacity: 0; transition: opacity 0.4s;
}
.ring {
  position: fixed; z-index: 2; left: 0; top: 0; pointer-events: none; box-sizing: border-box;
  border: 1px solid var(--accent); border-radius: 50%; opacity: 0; transition: opacity 0.2s;
}
.tip {
  position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity 0.2s;
  padding: 10px 14px; background: rgba(8,10,16,0.82); border: 1px solid var(--line); max-width: 260px;
}
.tip b { display: block; font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1; color: var(--fg); }
.tip span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--muted); }
.tip em { display: block; margin-top: 8px; font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--accent); }
.toast {
  position: fixed; z-index: 6; left: 50%; bottom: 96px; transform: translate(-50%, 10px);
  padding: 12px 18px; background: rgba(8,10,16,0.9); border: 1px solid var(--accent); color: var(--fg);
  font-size: 13px; letter-spacing: 0.04em; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; max-width: calc(100% - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.loader {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px;
  background: var(--bg); transition: opacity 0.9s; font-family: var(--mono); font-size: 12px; letter-spacing: 0.3em; color: var(--dim);
}
.loader.off { opacity: 0; pointer-events: none; }
.loader i { width: 120px; height: 1px; background: var(--line); position: relative; overflow: hidden; }
.loader i::after { content: ''; position: absolute; inset: 0; background: var(--accent); transform: translateX(-100%); animation: load 1.4s ease-in-out infinite; }
@keyframes load { to { transform: translateX(100%); } }
.credit {
  position: fixed; z-index: 3; left: 0; bottom: 0; margin: 0;
  padding-left: max(clamp(20px, 4vw, 48px), env(safe-area-inset-left, 0px));
  padding-bottom: max(22px, env(safe-area-inset-bottom, 0px));
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; line-height: 1.5; color: var(--dim);
}
.credit a { color: var(--muted); text-underline-offset: 3px; }
.credit a:hover { color: var(--accent); }
@media (max-width: 700px) { .credit { display: none; } }
.nogl { position: fixed; z-index: 2; left: 0; right: 0; bottom: 100px; text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px; display: none; }

@media (max-width: 700px) {
  .veil { background: linear-gradient(180deg, rgba(2,3,10,0.7) 0%, rgba(2,3,10,0.35) 60%, rgba(2,3,10,0) 100%); }
  .hero { justify-content: flex-start; padding-top: 18vh; gap: 16px; }
  .lede { min-height: 6.6em; }
  .level { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cue .bar, .loader i::after { animation: none; }
}
</style>
